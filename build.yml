name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name "CoolerSetup" installer.py
      - uses: actions/upload-artifact@v3
        with:
          name: CoolerSetup
          path: dist/CoolerSetup.exe
